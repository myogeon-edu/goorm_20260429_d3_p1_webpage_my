<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Task Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header card">
        <div class="header__top">
          <h1 class="header__title">Smart Task Planner</h1>
          <button type="button" class="btn btn--ghost" id="themeToggle" aria-label="테마 전환">
            테마
          </button>
        </div>
        <p class="header__tagline">목표만 입력하면, 계획까지 만들어 드립니다.</p>
      </header>

      <main class="main">
        <section class="card section" aria-labelledby="goal-heading">
          <h2 id="goal-heading" class="section__title">목표 입력</h2>
          <div class="field-row">
            <label class="field">
              <span class="field__label">목표</span>
              <input
                type="text"
                id="goalInput"
                class="input"
                placeholder="예: 포트폴리오 웹사이트 만들기"
                autocomplete="off"
              />
            </label>
            <button type="button" class="btn btn--primary" id="generateBtn">AI 계획 생성</button>
          </div>
          <p class="hint" id="aiStatus" role="status" aria-live="polite"></p>
        </section>

        <section class="card section" aria-labelledby="settings-heading">
          <h2 id="settings-heading" class="section__title">일정 설정</h2>
          <div class="settings-grid">
            <label class="field">
              <span class="field__label">하루 가능 시간 (시간)</span>
              <input type="number" id="dailyHours" class="input" min="0.5" max="24" step="0.5" value="2" />
            </label>
            <label class="field">
              <span class="field__label">시작일</span>
              <input type="date" id="startDate" class="input" />
            </label>
          </div>
        </section>

        <section class="card section" aria-labelledby="tasks-heading">
          <h2 id="tasks-heading" class="section__title">Task 리스트</h2>
          <ul class="task-list" id="taskList"></ul>
          <p class="empty" id="taskEmpty">AI로 계획을 생성하거나 아래에서 직접 추가하세요.</p>
          <button type="button" class="btn btn--secondary" id="addTaskBtn">Task 추가</button>
        </section>

        <section class="card section" aria-labelledby="schedule-heading">
          <h2 id="schedule-heading" class="section__title">일정 보기</h2>
          <div class="schedule" id="schedule"></div>
          <p class="empty" id="scheduleEmpty">미완료 Task와 일정 설정을 바탕으로 일정이 표시됩니다.</p>
        </section>
      </main>
    </div>

    <script src="ai.js"></script>
    <script src="script.js"></script>
  </body>
</html>
